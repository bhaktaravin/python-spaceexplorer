version: "3.9"
services:
  streamlit-app:
    build: .
    ports:
      - "${PORT}:8501"
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLECORS=false
    volumes:
      - .:/app

    env_file:
      - .env
    command: streamlit run main.py --server.address=0.0.0.0 --server.port=8501
    
